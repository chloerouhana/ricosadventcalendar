<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ton nouveau jeu</title>
<meta name="description" content="Un cadeau t'attend. Ouverture le 4 décembre.">
<meta property="og:title" content="Ton nouveau jeu">
<meta property="og:description" content="Un cadeau t'attend. Ouverture le 4 décembre.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a0d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--night:#1a0d2e;--dusk:#3a1a5e;--pink:#e5398c;--sun:#ff9a3d;--paper:#fffaf5;--ink:#1e1430;--mute:#6f6680;--line:#e7dfe6;--err:#c0262d}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:#fff;font:16px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;background:var(--night) linear-gradient(180deg,var(--dusk) 0,#2a1347 340px,var(--night) 760px) no-repeat;min-height:100vh;overflow-x:clip}
main{width:min(720px,100%);margin:0 auto;padding:clamp(28px,6vw,64px) 16px 48px;display:flex;flex-direction:column;align-items:center;gap:28px}
h1{margin:0;font-size:clamp(30px,6vw,46px);line-height:1.05;font-weight:700;letter-spacing:-.01em;text-align:center}
.lead{margin:-14px 0 0;color:#e8d9f2;text-align:center}
.photo{margin:0;width:min(460px,100%);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 70px -20px rgba(229,57,140,.55),0 12px 30px -12px rgba(0,0,0,.6)}
.photo img{display:block;width:100%;height:auto}
.card{width:100%;background:var(--paper);color:var(--ink);border-radius:16px;padding:clamp(22px,5vw,44px);box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
.card h2{margin:0 0 6px;font-size:clamp(22px,4vw,28px);line-height:1.15;font-weight:700;text-wrap:balance}
.sub{margin:0 0 24px;color:var(--mute);font-style:italic}
.terms{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:14px}
.terms li{counter-increment:t;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.terms li::before{content:counter(t);width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sign{margin-top:32px;padding-top:26px;border-top:1px solid var(--line);display:grid;gap:14px}
.sign-l{margin:0;font-weight:700}
.stack{display:grid;gap:14px}
.pad{position:relative;height:150px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.base{position:absolute;left:22px;right:22px;bottom:40px;border-bottom:1px dashed #c9bfcb}
.base::before{content:"×";position:absolute;left:0;bottom:4px;color:#a49aa8;font-size:18px}
.sig{position:absolute;left:46px;right:22px;bottom:30px;padding:0 4px 6px;font:clamp(40px,9vw,56px)/1.1 "Allura",cursive;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig.ph{bottom:52px;font:15px/1.4 "Instrument Sans",system-ui,sans-serif;color:#9a90a0;white-space:normal}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.f input{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;width:fit-content}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:600;min-height:48px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn:focus-visible,.f input:focus-visible,.chk input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.meta{margin:0;color:var(--mute);font-size:15px}
.done{margin:0;font-weight:600;color:var(--pink)}
.status{margin:0;min-height:1.4em;font-size:14px;color:var(--mute)}
.status.err{color:var(--err)}
footer{text-align:center;color:#bfaed0;font-size:13px;padding:0 16px 32px}
@media(max-width:480px){.fields{grid-template-columns:minmax(0,1fr)}.btn{width:100%}}
@media(prefers-reduced-motion:no-preference){.photo{animation:rise .8s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}}}

.lock{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 16px;text-align:center}
.lock h1{max-width:14ch}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(460px,100%)}
.unit{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 4px 12px}
.unit b{display:block;font-size:clamp(30px,9vw,46px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;font-size:13px;color:#dccbee}
.when{margin:0;color:#f0e4f8;font-size:17px}
.tease{margin:0;color:#bfaed0;font-size:14px;max-width:34ch}
.lock.wait .unit b{opacity:.35}
</style>
</head>
<body>
<section class="lock wait" id="lock" aria-live="polite">
  <h1>Ton cadeau s'ouvre dans</h1>
  <div class="count" role="timer">
    <div class="unit"><b id="cD">--</b><span>jours</span></div>
    <div class="unit"><b id="cH">--</b><span>heures</span></div>
    <div class="unit"><b id="cM">--</b><span>minutes</span></div>
    <div class="unit"><b id="cS">--</b><span>secondes</span></div>
  </div>
  <p class="when">Le 4 décembre 2026 à minuit, heure de Paris.</p>
  <p class="tease">Inutile de changer l'heure de ton téléphone, ça ne marchera pas.</p>
</section>
<main id="app" hidden></main>
<footer>Fait avec amour, pour toi.</footer>

<script>
function initApp() {
const $ = id => document.getElementById(id);
const KEY = 'contrat-gta-signature';
const sigText = $('sigText'), sFirst = $('sFirst'), sLast = $('sLast');

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.first === 'string' && typeof s.last === 'string' && !isNaN(Date.parse(s.at))) return s;
  } catch (e) {}
  return null;
}
function store(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'}) + ' à ' + d.getHours() + 'h' + String(d.getMinutes()).padStart(2, '0');
}
function say(el, msg, err) { el.textContent = msg || ''; el.classList.toggle('err', !!err); }
function message(s) {
  return 'Je soussigné ' + s.first + ' ' + s.last + ' accepte les conditions générales d’utilisation de mon jeu GTA, sans exception. Signé le ' + fmt(s.at) + '. Lu et approuvé.';
}

let S = load();
function render() {
  const name = S ? (S.first + ' ' + S.last) : (sFirst.value.trim() + ' ' + sLast.value.trim()).trim();
  sigText.textContent = name || 'Ta signature apparaîtra ici';
  sigText.classList.toggle('ph', !name);
  $('signForm').hidden = !!S;
  $('signed').hidden = !S;
  if (S) $('meta').textContent = 'Signé par ' + S.first + ' ' + S.last + ' le ' + fmt(S.at) + '. Lu et approuvé.';
}

for (const el of [sFirst, sLast]) el.addEventListener('input', () => { render(); say($('status'), ''); });

$('signForm').addEventListener('submit', async e => {
  e.preventDefault();
  const first = sFirst.value.trim(), last = sLast.value.trim();
  if (!first || !last) { say($('status'), 'Il manque le prénom ou le nom.', true); return; }
  if (!$('ok').checked) { say($('status'), 'Coche « Lu et approuvé » avant de signer.', true); return; }
  const s = {first: first, last: last, at: new Date(window.serverNow ? window.serverNow() : Date.now()).toISOString()};
  $('fDate').value = fmt(s.at);
  $('signBtn').disabled = true; say($('status'), 'Signature en cours…');
  try {
    await fetch('/', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(new FormData($('signForm'))).toString()});
  } catch (err) {}
  S = s; store(s); render();
  $('signBtn').disabled = false;
});

$('shareBtn').addEventListener('click', async () => {
  if (!S) return;
  const text = message(S);
  if (navigator.share) {
    try { await navigator.share({title: 'Contrat signé', text: text}); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  window.location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
});

$('copyBtn').addEventListener('click', async () => {
  if (!S) return;
  try { await navigator.clipboard.writeText(message(S)); say($('status2'), 'Texte copié. Tu peux le coller dans un message.'); }
  catch (e) { say($('status2'), message(S)); }
});

render();
}
{
const OPEN = Date.UTC(2026, 11, 3, 23, 0, 0); /* 4 décembre 2026, 00:00 à Paris (UTC+1) */
const K = '80fc255a548b88d6db416fbd';
let offset = 0, done = false, timer = null;
const now = () => Date.now() + offset;
window.serverNow = now;
const pad = n => String(n).padStart(2, '0');

async function sync() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  const ctl = window.AbortController ? new AbortController() : null;
  const stop = setTimeout(() => ctl && ctl.abort(), 5000);
  try {
    const t0 = Date.now();
    const r = await fetch(location.pathname + '?t=' + t0, {method: 'HEAD', cache: 'no-store', signal: ctl ? ctl.signal : undefined});
    const d = Date.parse(r.headers.get('date') || '');
    const age = parseInt(r.headers.get('age') || '0', 10) || 0;
    if (!isNaN(d)) offset = d + age * 1000 + 500 - (t0 + Date.now()) / 2;
  } catch (e) {}
  clearTimeout(stop);
}

function unlock() {
  if (done) return;
  done = true; clearTimeout(timer);
  const raw = atob(document.getElementById('payload').textContent.trim());
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i) ^ K.charCodeAt(i % K.length);
  const app = document.getElementById('app');
  app.innerHTML = new TextDecoder().decode(bytes);
  document.getElementById('lock').hidden = true;
  app.hidden = false;
  window.scrollTo(0, 0);
  initApp();
}

async function tick() {
  const left = OPEN - now();
  if (left <= 0) {
    await sync();
    if (OPEN - now() <= 0) { unlock(); return; }
  }
  const s = Math.max(0, Math.floor((OPEN - now()) / 1000));
  document.getElementById('cD').textContent = Math.floor(s / 86400);
  document.getElementById('cH').textContent = pad(Math.floor(s / 3600) % 24);
  document.getElementById('cM').textContent = pad(Math.floor(s / 60) % 60);
  document.getElementById('cS').textContent = pad(s % 60);
  document.getElementById('lock').classList.remove('wait');
  timer = setTimeout(tick, 1000 - (now() % 1000) + 20);
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && !done) { await sync(); clearTimeout(timer); tick(); }
});

sync().then(tick);
}
</script>
